[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-mm"
version = "0.1.0"
description = "Read-only research and market-making infrastructure for Kalshi"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[project.scripts]
metals-research = "src.metals.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
