[credentials]
api_key_id = "your-api-key-id"
private_key_path = "~/.rsa/private-key.pem"

[quoting]
min_market_width = 2            # Only quote if BBO spread >= this (cents)
min_join_depth_dollars = 500    # Hide behind this much cumulative depth ($)
min_edge_for_reduce = 1         # Can be alone on inventory-reducing side if edge >= this

[sizing]
quote_size_dollars = 30         # Base quote size in dollars
max_order_size_dollars = 30     # Fat finger protection per order
max_inventory_dollars = 30      # Per-market exposure limit

[inventory]
gamma = 0.01                    # Fade intensity: reservation = mid - q * gamma * sigma^2

[logging]
log_level = "INFO"
base_log_dir = "logs"
